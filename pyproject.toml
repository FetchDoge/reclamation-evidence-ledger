[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclamation-ledger"
version = "0.4.0"
description = "Provenance-first Sentinel-2 screening pipeline for Alberta orphan-well reclamation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Canonical dependency floors. requirements.txt stays as the pip-installable
# deploy file (dependabot watches it); keep the two in sync.
dependencies = [
    "pystac-client>=0.9.0",
    "rasterio>=1.5.2",
    "geopandas>=1.2.0",
    "xarray>=2026.9.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "duckdb>=1.5.6",
    "shapely>=2.1.2",
    "pyproj>=3.8.0",
    "matplotlib>=3.11.2",
    "jsonschema>=4.26.0",
    "python-dateutil>=2.9.0.post0",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
reclamation-pipeline = "ledger.pipeline:main"
reclamation-assess = "ledger.change:main"
reclamation-packet = "ledger.packet:main"
reclamation-memo = "ledger.memo:main"
reclamation-render = "ledger.render:main"
reclamation-sites = "ledger.sites:main"
reclamation-imagery = "ledger.imagery:main"
reclamation-geolocate = "ledger.geolocate:main"
reclamation-placebo = "ledger.placebo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ledger*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
